name: Algo no funciona
description: Un error en el sitio o en el design system
labels: [bug]
body:
  - type: textarea
    id: que
    attributes:
      label: Qué pasa
      description: Qué ves y qué esperabas ver.
    validations:
      required: true
  - type: input
    id: donde
    attributes:
      label: Dónde
      placeholder: "Ej. sección Arma tu zona, en iPhone con Safari"
  - type: textarea
    id: captura
    attributes:
      label: Captura
      description: Arrastra aquí una imagen si ayuda.
